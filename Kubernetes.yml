apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: rappels-deployment
  labels:
    app: rappels
spec:
  replicas: 1 #  tells deployment to run 1 pod matching the template
  selector:
    matchLabels:
      app: rappels
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rappels
    spec:
      containers:
      - name: rappels-container
        image: registry.gitlab.com/gitlabodix/cvtheque-rappels-ms-prod
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
      imagePullSecrets:
      - name: gitlab-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rappels-service
spec:
  selector:
    app: rappels
  ports:
    - port: 8003
      targetPort: 8003

