apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: rappels-deployment
  labels:
    app: rappels-MS
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rappels-MS
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rappels-MS
    spec:
      containers:
      - name: rappels-container
        image: registry.gitlab.com/gitlabodix/cvtheque-rappels-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Never
        ports:
        - containerPort: 8003
      imagePullSecrets:
      - name: gitlab-secrets-rappels-ms
---
apiVersion: v1
kind: Service
metadata:
  name: rappels-service
spec:
  selector:
    app: rappels-MS
  ports:
    - port: 8003
      targetPort: 8003

